name: DEV sharing

# Real sharing checks for People. Each mode starts fresh LastDB nodes on the
# runner, connects the publisher to the DEV cloud, and drives this commit's
# `people` command through a published LastDB nightly. people-direct starts
# four nodes. The other modes start a publisher and one recipient.
# The recipes are in ci/ and their node helpers in ci/lib/. A checkout of
# EdgeVector/lastdb at the nightly's exact source commit supplies the compiled
# endpoint profile, lastdb_node/environments.json, and the app SDK's data
# client for reading shared records. The People client under test is client/.
#
# Cloud steps run only on main. A pull request gets the syntax job and never
# receives cloud credentials. The sharing job checks out the event commit.
# It does not check out another ref: that would run branch code in the
# privileged main job.
#
# new-nightly selects the newest published LastDB nightly. A sharing job
# records that it started by saving the Actions cache key
# nightly-attempted-<tag>. That key is immutable, and nothing in this
# workflow executes the cached file. Only the first attempt of the minute-41
# poll skips a tag that already has the key. The 09:23 run, a push, a manual
# dispatch, and a human re-run always start sharing. A poll that is cancelled
# while pending never starts the sharing job, so it does not save the key.
on:
  push:
    branches: [main]
  # 07:17 UTC is when LastDB publishes its nightly. 09:23 UTC always proves
  # the newest one. Minute 41 polls for a nightly no sharing job has started.
  schedule:
    - cron: '23 9 * * *'
    - cron: '41 * * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Which check to run"
        type: choice
        options: [all, people-share, people-circles, people-scale, people-prepare, people-link, people-direct]
        default: all
      lastdb_release:
        description: "LastDB nightly tag, for example nightly-20261116-3484b912b. Empty selects the newest published nightly"
        type: string
      people_install_revision:
        description: "For a sharing mode, optionally install this exact signed People source from the registry"
        type: string
      people_install_registry:
        description: "Signed catalog for the exact install. Sharing operations still use the DEV cloud"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  # Main runs share one DEV publisher account, so they serialize.
  group: ${{ github.event_name == 'pull_request' && format('dev-sharing-pr-{0}', github.event.pull_request.number) || 'dev-sharing-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipe-syntax:
    name: Recipe syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      modes: ${{ steps.modes.outputs.modes }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require main for a manual cloud run
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main
      - name: Check the recipe syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          python3 -m py_compile ci/*.py ci/lib/*.py
          node --check ci/people_sdk.mjs
      - name: Select the modes
        id: modes
        env:
          MODE: ${{ inputs.mode || 'all' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            all) modes='["people-share","people-circles","people-scale","people-prepare","people-link","people-direct"]' ;;
            people-share|people-circles|people-scale|people-prepare|people-link|people-direct) modes="[\"$MODE\"]" ;;
            *) exit 2 ;;
          esac
          printf 'modes=%s\n' "$modes" >> "$GITHUB_OUTPUT"

  new-nightly:
    name: New nightly
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      run_sharing: ${{ steps.decide.outputs.run_sharing }}
    steps:
      - name: Select the newest published nightly
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          LASTDB_RELEASE: ${{ inputs.lastdb_release }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          tag="$LASTDB_RELEASE"
          if [ -z "$tag" ]; then
            tag="$(gh api 'repos/EdgeVector/lastdb/releases?per_page=30' \
              --jq '[.[] | select(.draft == false and (.tag_name | startswith("nightly-")))] | sort_by(.published_at) | last | .tag_name')"
          fi
          [[ "$tag" =~ ^nightly-[0-9]{8}-[0-9a-f]{9}$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          # github.event.schedule tells the two crons apart. Any other event,
          # the daily cron, and a re-run (attempt > 1) always share.
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "41 * * * *" ] && [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            printf 'poll=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'poll=false\n' >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Nightly"
            echo
            printf -- '- Tag: `%s`\n' "$tag"
            printf -- '- Event: `%s`\n' "$EVENT_NAME"
            printf -- '- Schedule: `%s`\n' "${EVENT_SCHEDULE:-none}"
            printf -- '- Run attempt: `%s`\n' "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Look for an attempt of this nightly
        id: attempted
        if: steps.select.outputs.poll == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nightly-attempt
          key: nightly-attempted-${{ steps.select.outputs.tag }}
          lookup-only: true
      - name: Decide whether sharing runs
        id: decide
        env:
          POLL: ${{ steps.select.outputs.poll }}
          CACHE_HIT: ${{ steps.attempted.outputs.cache-hit }}
          TAG: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          # A miss leaves cache-hit empty. Only an exact hit skips.
          if [ "$POLL" = "true" ] && [ "$CACHE_HIT" = "true" ]; then
            printf 'run_sharing=false\n' >> "$GITHUB_OUTPUT"
            printf -- '- Sharing: skipped, `%s` was already attempted\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'run_sharing=true\n' >> "$GITHUB_OUTPUT"
            echo "- Sharing: run" >> "$GITHUB_STEP_SUMMARY"
          fi

  sharing:
    name: ${{ matrix.mode }} in DEV
    needs: [recipe-syntax, new-nightly]
    if: >-
      !cancelled() &&
      needs.recipe-syntax.result == 'success' &&
      needs.new-nightly.result == 'success' &&
      needs.new-nightly.outputs.run_sharing == 'true'
    environment: dev-sharing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: ${{ fromJSON(needs.recipe-syntax.outputs.modes) }}
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Write the attempt marker
        env:
          TAG: ${{ needs.new-nightly.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^nightly-[0-9]{8}-[0-9a-f]{9}$ ]]
          mkdir -p "$RUNNER_TEMP/nightly-attempt"
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/nightly-attempt/tag.txt"
      - name: See whether this nightly was already marked
        id: prior
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nightly-attempt
          key: nightly-attempted-${{ needs.new-nightly.outputs.tag }}
          lookup-only: true
      # The save action exits 0 even when it stores nothing. The recipe still
      # runs. A poll can skip only on an exact hit, so a nightly that was
      # never stored cannot be skipped. A same-job re-read is not used: it
      # can miss a key that a later poll would see.
      - name: Save the attempt marker
        if: steps.prior.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nightly-attempt
          key: nightly-attempted-${{ needs.new-nightly.outputs.tag }}
      - name: Download and verify the LastDB nightly
        env:
          GH_TOKEN: ${{ github.token }}
          LASTDB_RELEASE: ${{ needs.new-nightly.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$LASTDB_RELEASE"
          [[ "$tag" =~ ^nightly-[0-9]{8}-[0-9a-f]{9}$ ]]
          release="$RUNNER_TEMP/lastdb-release"
          mkdir -m 700 "$release"
          gh release download "$tag" -R EdgeVector/lastdb -D "$release" \
            -p "lastdb-$TARGET.tar.gz" -p "lastdb-$TARGET.manifest.json" -p SHA256SUMS.txt -p nightly.json
          cd "$release"
          # The checksum list comes from the same release. It proves the files
          # are intact and consistent, not who published them.
          grep -E "  (lastdb-$TARGET\.(tar\.gz|manifest\.json)|nightly\.json)\$" SHA256SUMS.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 3
          sha256sum --check --strict selected.sha256
          manifest="lastdb-$TARGET.manifest.json"
          bundle="$(sha256sum "lastdb-$TARGET.tar.gz" | cut -d ' ' -f 1)"
          test "$(jq -r .artifact.sha256 "$manifest")" = "$bundle"
          test "$(jq -r .target "$manifest")" = "$TARGET"
          test "$(jq -r --arg target "$TARGET" '.platforms[$target].manifest.artifact.sha256' nightly.json)" = "$bundle"
          source="$(jq -r .source_git_oid "$manifest")"
          version="$(jq -r .version "$manifest")"
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.g[0-9a-f]{9}$ ]]
          test "${tag##*-}" = "${source:0:9}"
          bin="$RUNNER_TEMP/lastdb-bin"
          mkdir -m 700 "$bin"
          tar -xzf "lastdb-$TARGET.tar.gz" -C "$bin" lastdb lastdbd
          for name in lastdb lastdbd; do
            expected="$(jq -r --arg name "$name" '.binaries[] | select(.name == $name) | .sha256' "$manifest")"
            test "$(sha256sum "$bin/$name" | cut -d ' ' -f 1)" = "$expected"
          done
          {
            printf 'LASTDB_BIN=%s\n' "$bin"
            printf 'LASTDB_VERSION=%s\n' "$version"
            printf 'LASTDB_SOURCE_COMMIT=%s\n' "$source"
          } >> "$GITHUB_ENV"
          {
            printf 'LastDB nightly: `%s` (`%s`)\n\n' "$tag" "$version"
            printf 'LastDB source: `%s`\n\n' "$source"
            printf 'People source: `%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out LastDB at the nightly's source commit
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # LastDB is public. Clone it with no credentials. It supplies the
          # compiled DEV endpoints and the app SDK source of this build.
          source="$RUNNER_TEMP/lastdb-source"
          env -u GH_TOKEN -u GITHUB_TOKEN git clone --no-checkout --filter=blob:none \
            https://github.com/EdgeVector/lastdb.git "$source"
          git -C "$source" checkout --detach "$LASTDB_SOURCE_COMMIT"
          test "$(git -C "$source" rev-parse HEAD)" = "$LASTDB_SOURCE_COMMIT"
          test -f "$source/lastdb_node/environments.json"
          printf 'LASTDB_SOURCE=%s\n' "$source" >> "$GITHUB_ENV"
      - name: Build the LastDB app SDK for content reads
        if: matrix.mode == 'people-share' || matrix.mode == 'people-circles' || matrix.mode == 'people-scale'
        run: |
          set -euo pipefail
          # ci/people_sdk.mjs uses this repo's People client. It needs the LastDB
          # data client only to read shared records, so build that from the
          # source of the build under test.
          cd "$LASTDB_SOURCE/lastdb_app_sdk"
          npm ci
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir -m 700 "$RUNNER_TEMP/lastdb-app-sdk"
          tar -xzf "$RUNNER_TEMP"/lastdb-app-sdk-*.tgz -C "$RUNNER_TEMP/lastdb-app-sdk"
          test -f "$RUNNER_TEMP/lastdb-app-sdk/package/dist/index.js"
          printf 'LASTDB_APP_SDK=%s/lastdb-app-sdk/package\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install the signed log read tool dependency
        if: matrix.mode == 'people-circles'
        run: python3 -m pip install --quiet cryptography==41.0.7
      - name: Run the DEV check
        env:
          OPERATION: ${{ matrix.mode }}
          # Keep bytecode out of both checkouts. Publishing reads a clean checkout.
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
          PEOPLE_INSTALL_REVISION: ${{ inputs.people_install_revision }}
          PEOPLE_INSTALL_REGISTRY: ${{ inputs.people_install_registry }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ matrix.mode != 'people-prepare' && secrets.LASTDB_CLOUD_DEV_API_KEY || '' }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ matrix.mode != 'people-prepare' && secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE || '' }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            people-share) recipe=people_share ;;
            people-circles) recipe=people_circles ;;
            people-scale) recipe=people_scale ;;
            people-prepare) recipe=people_prepare ;;
            people-link) recipe=people_link ;;
            people-direct) recipe=people_direct ;;
            *) exit 2 ;;
          esac
          export PYTHONPATH="$GITHUB_WORKSPACE/ci/lib"
          python3 "ci/$recipe.py" --bin-dir "$LASTDB_BIN" --version "$LASTDB_VERSION"

  # LastDB's notify-scheduled-failure.yml checks out the caller and runs
  # scripts/ci/notify_scheduled_failure.py, which accepts only EdgeVector/lastdb.
  # This job is that same issue lifecycle for People.
  notify:
    name: Notify on failure
    needs: [recipe-syntax, new-nightly, sharing]
    if: >-
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'push') &&
      (needs.recipe-syntax.result == 'failure' ||
       needs.new-nightly.result == 'failure' ||
       needs.sharing.result == 'failure' ||
       needs.sharing.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Open, update, or close the workflow issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: dev-sharing.yml
          JOB_RESULTS: ${{ needs.recipe-syntax.result }} ${{ needs.new-nightly.result }} ${{ needs.sharing.result }}
          SHARING_RESULT: ${{ needs.sharing.result }}
          NIGHTLY_TAG: ${{ needs.new-nightly.outputs.tag }}
        run: python3 ci/notify_scheduled_failure.py
